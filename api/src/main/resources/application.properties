spring.application.name=api
spring.config.import=optional:file:../.env[.properties]
server.port=${PORT:8082}
server.address=127.0.0.1
server.forward-headers-strategy=none

server.servlet.session.timeout=${SESSION_TIMEOUT:15m}
server.servlet.session.cookie.secure=${REQUIRE_HTTPS:false}
server.servlet.session.cookie.same-site=lax

app.database.directory=${AUTOMANTLE_DATA_DIR:${user.home}/.local/share/automantle}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

app.security.frontend-url=${FRONTEND_URL:http://localhost:${server.port}}
app.security.require-https=${REQUIRE_HTTPS:false}

app.http-policy.max-body-size=${HTTP_POLICY_MAX_BODY_SIZE:8MB}
app.http-policy.max-preview-size=${HTTP_POLICY_MAX_PREVIEW_SIZE:16KB}
app.http-policy.max-rule-values=${HTTP_POLICY_MAX_RULE_VALUES:100}
app.http-policy.max-credential-placements=${HTTP_POLICY_MAX_CREDENTIAL_PLACEMENTS:32}
app.http-policy.max-selector-length=${HTTP_POLICY_MAX_SELECTOR_LENGTH:128}
app.http-policy.max-json-pointer-length=${HTTP_POLICY_MAX_JSON_POINTER_LENGTH:1024}
app.http-policy.max-content-type-length=${HTTP_POLICY_MAX_CONTENT_TYPE_LENGTH:1024}
app.http-policy.max-path-length=${HTTP_POLICY_MAX_PATH_LENGTH:2048}

app.gateway.socket=/run/automantle-gateway/control.sock
app.gateway.binary=/usr/local/bin/automantle-gateway
app.gateway.external-terminal=/usr/bin/x-terminal-emulator
